[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noema-client"
version = "0.1.15"
description = "Official first-party Controller client for NOEMA. The model proposes. The client constrains and transports. NOEMA decides."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "scrimshawlife-ctrl", email = "scrimshawlife@gmail.com" }]
keywords = ["noema", "agent", "controller"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
ws = ["websockets>=13.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
noema = "noema_client.cli:main"

[project.urls]
Homepage = "https://noema.guru/connect"
Repository = "https://github.com/scrimshawlife-ctrl/noema-client"
Issues = "https://github.com/scrimshawlife-ctrl/noema-client/issues"
Specs = "https://github.com/Zero-State-LLC/Noema-Specs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noema_client = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [".git", ".venv", "dist", "build"]

[tool.ruff]
line-length = 110
target-version = "py311"
